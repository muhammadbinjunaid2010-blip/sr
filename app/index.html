<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillRun - Learn by Building</title>
  <meta name="description" content="SkillRun app - learn to code by building. 10 missions, real skills.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../skillrun-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="dashboard">

  <div class="app-shell">

    <header class="app-header">
      <div class="container">
        <a class="logo" href="index.html" aria-label="SkillRun home">
          <img src="../skillrun-logo.svg" alt="SkillRun logo">
          <span class="logo-text">SkillRun</span>
        </a>
        <div class="header-right">
          <a class="header-avatar" data-header-avatar href="?tab=profile" aria-label="Profile">S</a>
          <span class="xp-chip" data-xp-chip>Lv 1</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="container">
        <div id="view"></div>
      </div>
    </main>

    <nav class="tab-bar" aria-label="Main navigation">
      <button class="tab" data-tab="home" type="button">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span><span>Home</span>
      </button>
      <button class="tab" data-tab="learn" type="button">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span><span>Learn</span>
      </button>
      <button class="tab" data-tab="practice" type="button">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span><span>Practice</span>
      </button>
      <button class="tab" data-tab="projects" type="button">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><span>Projects</span>
      </button>
      <button class="tab" data-tab="leaderboard" type="button">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 5H3v3a4 4 0 0 0 4 4M17 5h4v3a4 4 0 0 1-4 4"/></svg></span><span>Leaderboard</span>
      </button>
      <button class="tab" data-tab="profile" type="button">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>Profile</span>
      </button>
    </nav>

    <div class="onboarding" id="onboarding" style="display:none">
      <div class="ob-card">
        <div id="onboard-body"></div>
      </div>
    </div>

    <div class="install-banner" id="install-banner" style="display:none">
      <span>Install SkillRun on your phone</span>
      <button type="button" onclick="window.__SkillRunInstall && __SkillRunInstall()">Install</button>
    </div>

    <div class="toast" id="toast"></div>

  </div>

  <script src="js/missions.js"></script>
  <script src="js/missions-js.js"></script>
  <script src="js/paths.js"></script>
  <script src="js/missions-web.js"></script>
  <script src="js/missions-web2.js"></script>
  <script src="js/python-eval.js"></script>
  <script src="js/missions-python.js"></script>
  <script src="js/electronics.js"></script>
  <script src="js/missions-electronics.js"></script>
  <script src="js/missions-portfolio.js"></script>
  <script src="js/practice-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/app-install.js"></script>
</body>
</html>
